<table class="table table-striped">
  <thead>

  <th>Name</th>
  <th>Price</th>
  <th>Description</th>
  <th>Maximum Quantity</th>
  </thead>
  <tbody>
    <tr *ngFor="let product of products">
 
      <td>{{product.name}}</td>
      <td>{{product.sellingPrice | number:'1.2-2' }}</td>
      <td>{{product.description}}</td>
      <td>{{product.maximumQuantity | number}}</td>
    </tr>
  </tbody>
</table>
